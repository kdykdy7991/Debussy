[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-voice-service"
version = "0.1.0"
description = "Local speech synthesis service for Pi"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio==4.14.2",
  "faster-qwen3-tts==0.3.2",
  "fastapi==0.139.2",
  "numpy==2.4.6",
  "pydantic==2.13.4",
  "qwen-tts==0.1.1",
  "soundfile==0.13.1",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
pi-voice-service = "pi_voice.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

