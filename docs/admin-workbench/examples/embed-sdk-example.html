<!doctype html>
<!--
  WB-010 host-side integration example.
  The Embed SDK is a framework-agnostic module (packages/web/src/embed/sdk/skdy-embed.ts).
  Bundle/import it with your host's build toolchain and call create() to mount the
  chat iframe. The SDK never touches host private keys and never writes the Launch
  Token to the URL or storage — it sends it once over postMessage then drops it.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Embed chat example</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      #inline-chat { width: 400px; height: 600px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
      #floating-launcher { position: fixed; right: 1rem; bottom: 1rem; z-index: 9999; }
    </style>
  </head>
  <body>
    <h1>Embed SDK example</h1>
    <h2>Inline</h2>
    <div id="inline-chat"></div>
    <h2>Floating</h2>
    <div id="floating-launcher">
      <button type="button" id="floating-btn">打开助手</button>
    </div>

    <script type="module">
      // In a real host, import from your bundled copy of skdy-embed.ts.
      import { create } from "/embed/sdk/skdy-embed.ts";

      const appId = "pub_<uuid>"; // your published App public id
      const baseUrl = "https://agent.example.com";
      // signed_user: a host-backend-signed Launch Token (anonymous mode omits it).
      const launchToken = null; // e.g. await fetch("/api/embed-launch-token").then(r => r.json())

      // ---- inline ----
      const inline = create({
        appId,
        baseUrl,
        container: document.getElementById("inline-chat"),
        launchToken,
        initWidth: 400,
        initHeight: 600,
      });
      inline.on("ready", () => console.log("embed ready"));
      inline.on("conversation-created", (p) => console.log("conversation", p.conversationId));
      inline.on("error", (e) => console.error("embed error", e.code, e.message));
      inline.on("resize", (p) => console.log("desired height", p.height));
      inline.open();

      // ---- floating (created once, open/close toggles) ----
      const floating = create({ appId, baseUrl, launchToken, initWidth: 360, initHeight: 480 });
      const btn = document.getElementById("floating-btn");
      btn.addEventListener("click", () => floating.close(), { once: true });
      floating.on("ready", () => {
        btn.textContent = "关闭助手";
      });

      // Host logout: telegraph signed-user logout so the iframe clears credentials.
      // document.querySelector("#logout").addEventListener("click", () => floating.logout());
    </script>
  </body>
</html>
