services:
  postgres:
    image: ${PI_ADMIN_DEV_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: pi_admin_dev
      POSTGRES_USER: pi_admin_dev
      POSTGRES_PASSWORD: pi_admin_dev
    ports:
      - "127.0.0.1:${PI_ADMIN_DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - pi-admin-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_admin_dev -d pi_admin_dev"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: ${PI_ADMIN_DEV_REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${PI_ADMIN_DEV_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pi-admin-dev-postgres:
